name: smoke
# 묶은 앱을 Windows·맥·리눅스 서버에서 실제로 띄워 탭마다 화면을 찍는다(scripts/smoke.mjs).
# 개발 PC에서 맥·리눅스를 직접 볼 수 없어서, 찍은 화면과 summary.json을 결과물(artifact)로 받아 확인한다.
on:
  push:
    branches: [mac-support]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: npx electron-builder --win --dir
          - os: macos-latest
            pack: npx electron-builder --mac --dir --arm64
          - os: ubuntu-latest
            pack: npx electron-builder --linux --dir
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: ${{ matrix.pack }}
      - if: runner.os == 'macOS'
        # 임시 서명(ad-hoc)이 붙어야 Apple 실리콘에서 실행된다. 서명 상태를 기록해 둔다
        run: mkdir -p smoke-out && codesign -dv --verbose=2 release/mac-arm64/*.app 2>&1 | tee smoke-out/codesign.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x900x24" node scripts/smoke.mjs smoke-out
      - if: runner.os != 'Linux'
        run: node scripts/smoke.mjs smoke-out
      - if: failure() && runner.os == 'macOS'
        # 맥에서 앱이 죽으면 원인을 볼 자료: 앱 꾸러미 안 이름들(보조 프로세스 앱), Info.plist, 충돌 보고서
        run: |
          mkdir -p smoke-out/diag
          APP=$(ls -d release/mac-arm64/*.app | head -1)
          ls -la "$APP/Contents/MacOS" "$APP/Contents/Frameworks" > smoke-out/diag/bundle.txt 2>&1
          plutil -p "$APP/Contents/Info.plist" > smoke-out/diag/info-plist.txt 2>&1
          for h in "$APP"/Contents/Frameworks/*Helper*.app; do echo "== $h"; plutil -p "$h/Contents/Info.plist" | grep -E "CFBundle(Name|Executable|DisplayName)"; done > smoke-out/diag/helpers.txt 2>&1
          cp ~/Library/Logs/DiagnosticReports/*.ips smoke-out/diag/ 2>/dev/null || true
      - if: failure() && runner.os == 'macOS'
        # 원본 Electron으로는 뜨고 묶은 앱만 죽는다(0.2.9 개발 중). 묶을 때만 달라지는 것을 하나씩 바꿔 원인을 가른다
        run: |
          # 1) 디버깅 포트 등 추가 인수 없이 띄워 15초 뒤 살아 있는지, 화면 캡처
          APP=$(ls -d release/mac-arm64/*.app | head -1); D=$(mktemp -d)
          GEULNUN_USER_DATA=$D "$APP/Contents/MacOS/Fairhand" > smoke-out/var-noflags.log 2>&1 & PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then echo "15초 뒤 살아 있음" > smoke-out/var-noflags.txt; screencapture -x smoke-out/var-noflags.png || true; kill $PID
          else wait $PID; echo "끝남: 종료 코드 $?" > smoke-out/var-noflags.txt; fi
          # 2) 퓨즈를 Electron 기본값으로 / 3) 쿠키 암호화 퓨즈만 끔 / 4) 제품 이름을 영문으로(보조 앱 이름이 'Fairhand Helper'가 된다)
          npx electron-builder --mac --dir --arm64 -c.directories.output=release-fuses-default -c.electronFuses.runAsNode=true -c.electronFuses.enableCookieEncryption=false -c.electronFuses.enableNodeOptionsEnvironmentVariable=true -c.electronFuses.enableNodeCliInspectArguments=true -c.electronFuses.onlyLoadAppFromAsar=false > smoke-out/build-fuses-default.log 2>&1 || true
          SMOKE_RELEASE_DIR=release-fuses-default node scripts/smoke.mjs smoke-out/var-fuses-default || true
          npx electron-builder --mac --dir --arm64 -c.directories.output=release-no-cookie-enc -c.electronFuses.enableCookieEncryption=false > smoke-out/build-no-cookie-enc.log 2>&1 || true
          SMOKE_RELEASE_DIR=release-no-cookie-enc node scripts/smoke.mjs smoke-out/var-no-cookie-enc || true
          npx electron-builder --mac --dir --arm64 -c.directories.output=release-ascii-name -c.productName=Fairhand > smoke-out/build-ascii-name.log 2>&1 || true
          SMOKE_RELEASE_DIR=release-ascii-name node scripts/smoke.mjs smoke-out/var-ascii-name || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-out
          retention-days: 14
