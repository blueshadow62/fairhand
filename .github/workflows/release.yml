name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # package.json을 안 올리고 태그만 밀면 옛 설치 파일이 새 릴리스에 올라가고 사용자는 영원히 '최신'으로 본다
      - run: node -e 'const v = "v" + require("./package.json").version; if (v !== process.env.TAG) { console.error(`package.json ${v} != tag ${process.env.TAG}`); process.exit(1); }'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
      - run: npm test
      # 빌더가 직접 올리면 초안이 둘 생기는 일이 있어(0.2.1·0.2.2), 빌드만 하고 초안 하나를 gh로 만든다. 설명을 적고 직접 공개한다.
      - run: npx electron-builder --win --publish never
      - run: gh release create "${{ github.ref_name }}" --draft --title "글눈 ${{ github.ref_name }}" --notes "설명을 적는 중입니다." release/geulnun-setup-*.exe release/latest.yml release/*.blockmap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
