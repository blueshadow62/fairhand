# 의존성·액션의 새 판과 취약점을 매주 알려 준다(PR로). 올릴지는 CHANGELOG를 읽고 하나씩 정한다
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Electron 45가 품은 Node는 24. 26 타입이면 앱에 없는 API가 컴파일을 통과한다
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
